    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        p { color: #94a3b8; font-size: 0.9rem; }
        input { padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; font-size: 0.95rem; width: 100%; outline: none; }
        input:focus { border-color: #2563eb; }
        .btn { background-color: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
        .btn:hover { background-color: #1d4ed8; }
        .erro { color: #dc2626; font-size: 0.85rem; font-weight: bold; display: none; }
    </style>
</head>

    function descriptografar() {
        const senhaDigitada = document.getElementById('senhaInput').value;
        const msgErro = document.getElementById('erroSenha');

        try {
            const bytes = CryptoJS.AES.decrypt(dadoCriptografado, senhaDigitada);
            const codigoOriginal = bytes.toString(CryptoJS.enc.Utf8);

            if (!codigoOriginal) {
                throw new Error('Senha inválida');
            }

            // Substitui o documento atual pelo código original descriptografado em tempo de execução
            document.open();
            document.write(codigoOriginal);
            document.close();
        } catch (e) {
            msgErro.style.display = 'block';
            document.getElementById('senhaInput').value = '';
        }
    }

    function verificarEnter(e) {
        if (e.key === 'Enter') descriptografar();
    }
